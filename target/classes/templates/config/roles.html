<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Vai tro va trang thai')"></head>
<body>
<nav th:replace="fragments/layout :: navbar"></nav>
<div class="container">
    <div class="card">
        <p>
            <a class="btn btn-sm btn-secondary" th:href="@{/config/users}">Nguoi dung</a>
            <a class="btn btn-sm btn-secondary" th:href="@{/config/units}">Don vi</a>
            <a class="btn btn-sm btn-secondary" th:href="@{/config/systems}">He thong</a>
            <a class="btn btn-sm btn-secondary" th:href="@{/config/databases}">CSDL</a>
            <a class="btn btn-sm" th:href="@{/config/roles}">Vai tro/Trang thai</a>
        </p>
    </div>
    <div class="card">
        <h3>Danh muc vai tro</h3>
        <table>
            <thead><tr><th>Ma</th><th>Ten</th><th>Mo ta</th></tr></thead>
            <tbody>
            <tr th:each="r : ${roles}">
                <td th:text="${r.code}"></td>
                <td th:text="${r.name}"></td>
                <td th:text="${r.description}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="card">
        <h3>Danh muc trang thai</h3>
        <table>
            <thead><tr><th>Ma</th><th>Y nghia</th></tr></thead>
            <tbody>
            <tr th:each="s : ${statuses}">
                <td th:text="${s.name()}"></td>
                <td th:text="${s.displayName}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="card">
        <h3>Danh muc quyen truy cap</h3>
        <table>
            <thead><tr><th>Ma</th><th>Ten</th><th>Hieu luc</th></tr></thead>
            <tbody>
            <tr th:each="r : ${rights}">
                <td th:text="${r.code}"></td>
                <td th:text="${r.name}"></td>
                <td th:text="${r.active} ? 'Co' : 'Khong'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
