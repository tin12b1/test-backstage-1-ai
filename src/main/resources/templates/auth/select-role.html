<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Chọn vai trò - Agribank')"></head>
<body>
<div class="auth-bg">
    <div class="auth-card">
        <div class="head">
            <img class="emblem" th:src="@{/img/agribank-emblem.svg}" alt="Agribank"/>
            <div class="name">AGRIBANK</div>
            <div class="sub">Hệ thống Quản lý truy cập Cơ sở dữ liệu</div>
        </div>
        <div class="body">
            <h3 style="margin-top:0">Chọn vai trò làm việc</h3>
            <p class="text-muted">Tài khoản của bạn được gán nhiều vai trò. Chọn vai trò để tiếp tục.</p>

            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/session/role}" method="post">
                <div class="form-row">
                    <label for="roleCode">Vai trò</label>
                    <select id="roleCode" name="roleCode">
                        <option th:each="r : ${roles}"
                                th:value="${r.name()}"
                                th:text="${r.displayName}"></option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width:100%">Tiếp tục</button>
            </form>
        </div>
    </div>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
