<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Cau hinh don vi')"></head>
<body>
<nav th:replace="fragments/layout :: navbar"></nav>
<div class="container">
    <div class="alert alert-info" th:if="${infoMessage}" th:text="${infoMessage}"></div>
    <div class="card">
        <p>
            <a class="btn btn-sm btn-secondary" th:href="@{/config/users}">Nguoi dung</a>
            <a class="btn btn-sm" th:href="@{/config/units}">Don vi</a>
            <a class="btn btn-sm btn-secondary" th:href="@{/config/systems}">He thong</a>
            <a class="btn btn-sm btn-secondary" th:href="@{/config/databases}">CSDL</a>
            <a class="btn btn-sm btn-secondary" th:href="@{/config/roles}">Vai tro/Trang thai</a>
        </p>
    </div>
    <div class="card">
        <h3>Them don vi</h3>
        <form th:action="@{/config/units}" method="post"
              style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap">
            <div class="form-row" style="flex:0 0 160px; margin:0"><label>Ma</label>
                <input type="text" name="code" required/></div>
            <div class="form-row" style="flex:1 1 260px; margin:0"><label>Ten don vi</label>
                <input type="text" name="name" required/></div>
            <button type="submit" class="btn">Them</button>
        </form>
    </div>
    <div class="card">
        <h3>Danh sach don vi</h3>
        <table>
            <thead><tr><th>Ma</th><th>Ten</th><th>Hieu luc</th></tr></thead>
            <tbody>
            <tr th:each="u : ${units}">
                <td th:text="${u.code}"></td>
                <td th:text="${u.name}"></td>
                <td th:text="${u.active} ? 'Co' : 'Khong'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
