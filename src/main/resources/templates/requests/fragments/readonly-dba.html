<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment: readonly-dba
  Phan "Phan DBA ghi" (read-only, chi dung cho mau 03-YCCT)
  Su dung: th:replace="requests/fragments/readonly-dba :: readonlyDba"
-->
<div th:fragment="readonlyDba">
    <div class="card" style="margin-top:16px; opacity:0.7">
        <h3>Phan DBA ghi</h3>
        <p class="text-muted">Phan nay do DBA dien khi thuc hien thay doi cau truc CSDL.</p>

        <div class="form-row">
            <label>Ghi chu cua DBA</label>
            <textarea readonly disabled rows="4" class="form-control"
                      placeholder="(Do DBA dien khi thuc hien)"></textarea>
        </div>

        <div style="display:flex; gap:14px; flex-wrap:wrap">
            <div class="form-row" style="flex:1 1 220px">
                <label>Nguoi thuc hien (DBA)</label>
                <input type="text" readonly disabled class="form-control" placeholder=""/>
            </div>
            <div class="form-row" style="flex:1 1 180px">
                <label>Ngay thuc hien</label>
                <input type="date" readonly disabled class="form-control"/>
            </div>
        </div>

        <!-- O ky DBA -->
        <div style="margin-top:12px; border:1px dashed #ccc; padding:12px; text-align:center; max-width:220px; min-height:100px">
            <label class="text-muted">DBA ky xac nhan</label>
            <div style="height:50px; border:1px solid #eee; margin-top:8px; background:#f9f9f9"></div>
            <small class="text-muted">Chua ky</small>
        </div>
    </div>
</div>

</body>
</html>
