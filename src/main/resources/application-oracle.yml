# Profile Oracle: kich hoat bang -Dspring.profiles.active=oracle hoac SPRING_PROFILES_ACTIVE=oracle.
# Toan bo thong tin ket noi externalized qua bien moi truong, khong hard-code.
spring:
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//10.0.83.36:1521/ebankpdb_pt}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USER:qltcdb}
    password: ${ORACLE_PASSWORD:qltcdb}
    hikari:
      maximum-pool-size: ${ORACLE_POOL_MAX:10}
      minimum-idle: ${ORACLE_POOL_MIN:2}
      connection-timeout: ${ORACLE_CONN_TIMEOUT_MS:30000}
      pool-name: csdl-oracle-pool

  jpa:
    # KHONG dung create/create-drop tren Oracle that. Mac dinh validate de tranh sua schema ngoai y muon.
    hibernate:
      ddl-auto: ${ORACLE_DDL_AUTO:validate}
    database-platform: ${ORACLE_DIALECT:org.hibernate.dialect.Oracle12cDialect}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: ${ORACLE_TZ:Asia/Ho_Chi_Minh}
    defer-datasource-initialization: false
    open-in-view: false

  # Khong tu chay data.sql tren Oracle; seed/DDL quan ly rieng.
  sql:
    init:
      mode: never

  # Tat H2 console o moi truong Oracle.
  h2:
    console:
      enabled: false
